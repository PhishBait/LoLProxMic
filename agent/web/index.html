<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #010a13;
    --bg-raise: #0a1428;
    --line: #1e2d45;
    --gold: #c8aa6e;
    --gold-dim: #785a28;
    --teal: #0ac8b9;
    --red: #e84057;
    --text: #cdd6e4;
    --text-dim: #5b6b85;
    --font-disp: "Rajdhani", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, #06263c66, transparent),
      radial-gradient(900px 500px at -10% 110%, #14243f66, transparent),
      var(--bg);
    color: var(--text);
    font-family: var(--font-disp);
    min-height: 100vh;
    display: flex; justify-content: center;
    padding: 40px 16px;
  }
  .panel {
    width: 100%; max-width: 520px;
    background: linear-gradient(180deg, #0a1428f0, #050d1af0);
    border: 1px solid var(--gold-dim);
    outline: 1px solid #000;
    box-shadow: 0 0 60px #000c, inset 0 1px 0 #c8aa6e22;
    padding: 26px 28px 22px;
    position: relative;
  }
  .panel::before, .panel::after {  /* hextech corner ticks */
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid var(--gold);
  }
  .panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .panel::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  h1 {
    font-size: 26px; font-weight: 700; letter-spacing: 4px;
    color: var(--gold); text-transform: uppercase;
  }
  h1 em { color: var(--teal); font-style: normal; }
  .tagline { color: var(--text-dim); font-size: 12px; letter-spacing: 1px; }

  .chips { display: flex; gap: 8px; margin: 14px 0 20px; }
  .chip {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px;
    padding: 3px 10px; border: 1px solid var(--line);
    color: var(--text-dim); text-transform: uppercase;
  }
  .chip.ok   { border-color: var(--teal); color: var(--teal); }
  .chip.bad  { border-color: var(--red);  color: var(--red); }
  .chip.idle { border-color: var(--line); color: var(--text-dim); }

  form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .full { grid-column: 1 / -1; }
  label { display: block; }
  label span {
    display: block; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px;
  }
  input, select {
    width: 100%; padding: 9px 10px;
    background: #061020; border: 1px solid var(--line);
    color: var(--text); font-family: var(--font-mono); font-size: 13px;
  }
  input:focus, select:focus { outline: 1px solid var(--gold-dim); }

  button {
    grid-column: 1 / -1; margin-top: 6px; padding: 12px;
    background: linear-gradient(180deg, #1e2d45, #0d1a30);
    border: 1px solid var(--gold-dim); color: var(--gold);
    font-family: var(--font-disp); font-weight: 700; font-size: 15px;
    letter-spacing: 3px; text-transform: uppercase; cursor: pointer;
    transition: border-color .15s, color .15s, box-shadow .15s;
  }
  button:hover {
    border-color: var(--gold); color: #f0e6d2;
    box-shadow: 0 0 18px #c8aa6e33;
  }

  #status {
    font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
    margin: 12px 0 18px; min-height: 16px;
  }

  h2 {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-dim); border-bottom: 1px solid var(--line);
    padding-bottom: 6px; margin-bottom: 10px;
  }
  .peer { padding: 8px 0; border-bottom: 1px solid #0d1a30; }
  .peer-head { display: flex; align-items: center; gap: 8px; }
  .speak {
    width: 8px; height: 8px; border-radius: 50%;
    background: #223046; flex: none; transition: background .1s;
  }
  .speak.on { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  .peer-name { font-weight: 600; font-size: 15px; }
  .peer-champ { color: var(--text-dim); font-size: 12px; }
  .peer-dist {
    margin-left: auto; font-family: var(--font-mono);
    font-size: 12px; color: var(--gold);
  }
  .peer-conn { font-family: var(--font-mono); font-size: 11px; color: var(--red); }
  .vol { height: 3px; background: #0d1a30; margin-top: 6px; }
  .vol-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); transition: width .2s; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 10px 0; }

  .vision { margin-top: 20px; }
  .vision summary {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-dim); cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  .vision summary:hover { color: var(--gold); }
  .vision-body { padding-top: 10px; }
  .vision-body img {
    display: block; width: 100%; image-rendering: pixelated;
    border: 1px solid var(--line); background: #061020; min-height: 60px;
  }
  .vision-info {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-dim); margin-top: 6px;
  }

  .tuning { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .tuning label span b { color: var(--gold); font-family: var(--font-mono); font-weight: 500; }
  input[type=range] { padding: 0; accent-color: #c8aa6e; background: transparent; border: 0; }

  footer {
    margin-top: 22px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--text-dim); letter-spacing: .5px;
  }
</style>
</head>
<body>
  <div class="panel">
    <header>
      <h1>Prox<em>Chat</em></h1>
      <span class="tagline">proximity voice for the Rift</span>
    </header>

    <div class="chips">
      <span id="chip-agent" class="chip idle">agent</span>
      <span id="chip-game"  class="chip idle">no game</span>
      <span id="chip-voice" class="chip idle">voice</span>
    </div>

    <form onsubmit="return false">
      <label class="full"><span>Signaling server</span>
        <input id="serverUrl" placeholder="ws://host:8080 or wss://…" autocomplete="off">
      </label>
      <label><span>Room</span>
        <input id="room" placeholder="default" autocomplete="off">
      </label>
      <label><span>Password</span>
        <input id="password" type="password" autocomplete="off">
      </label>
      <label class="full"><span>Riot ID (auto-filled in game)</span>
        <input id="riotId" placeholder="Name#TAG" autocomplete="off">
      </label>
      <button id="connectBtn" type="button">Connect</button>
    </form>

    <div id="status"></div>

    <h2>Party</h2>
    <div id="peers"><div class="empty">no one else connected yet</div></div>

    <details id="vision" class="vision">
      <summary>Vision debug</summary>
      <div class="vision-body">
        <img id="visionImg" alt="minimap capture will appear here once in game">
        <div id="visionInfo" class="vision-info">waiting for a game…</div>
      </div>
    </details>

    <div class="tuning">
      <label><span>Mode</span>
        <select id="mode">
          <option value="distance">distance (all)</option>
          <option value="team">team only</option>
        </select>
      </label>
      <label><span>Hearing range <b id="maxDistVal">1800</b></span>
        <input id="maxDist" type="range" min="600" max="6000" step="100" value="1800">
      </label>
      <label><span>Volume</span>
        <input id="masterVol" type="range" min="0" max="100" value="100">
      </label>
    </div>

    <footer>
      Reads only your own screen + Riot's official local API · no injection ·
      no memory reads
    </footer>
  </div>

  <script src="spatial.js"></script>
  <script src="app.js"></script>
</body>
</html>
